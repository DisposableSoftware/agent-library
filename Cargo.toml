[package]
name = "agent-library"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "agent-library"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.12"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
strip = true
opt-level = "z"
